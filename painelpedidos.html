<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./style/painelpedidos.css" />
    <title>Painel de Pedidos</title>
  </head>
  <body>
    <header class="topo-painel">
      <a href="admin.html" class="btn-voltar"><i class="fas fa-arrow-left"></i>Voltar</a>

      <h1 class="titulo">Pedidos</h1>

      <span class="pendentes">
        Pendentes: <strong id="qtdPendentes">0</strong>
      </span>
    </header>

    <section class="filtro">
      <div class="grupo-filtro">
        <span class="label-filtro">Período</span>
        <div class="filtros">
          <button data-filtro="hoje" class="ativo">Hoje</button>
          <button data-filtro="semana">Semana</button>
          <button data-filtro="mes">Mês</button>
          <button data-filtro="ano">Ano</button>
          <button data-filtro="todos">Todos</button>
        </div>
      </div>

      <div class="grupo-filtro">
        <span class="label-filtro">Status</span>
        <div class="filtros-status">
          <button data-status="Pago" class="ativo">Pendentes</button>
          <button data-status="Preparando">Em preparo</button>
          <button data-status="Pronto">Prontos</button>
          <button data-status="Cancelado">Cancelados</button>
          <button data-status="todos">Todos</button>
        </div>
      </div>
    </section>

    <main id="listaPedidos">
      <!-- Pedidos serão inseridos via JS -->
    </main>

    <script src="./js/painelpedidos.js" defer></script>
  </body>
</html>
